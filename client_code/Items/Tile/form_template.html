<div class="ui-card tile">
  <anvil-component type="Label" name="tag" prop:role='["tile-tag"]' bind:text="self.item.get('tag', '')"></anvil-component>
  <anvil-component type="Label" name="badge" prop:role='["bm-st"]' bind:text="self.item.get('badge', '')"></anvil-component>
  <div class="tile-h" anvil:name="head"><i class="ic" anvil:name="icon"></i><anvil-component type="Label" name="title" prop:role='["tile-title"]' bind:text="self.item.get('title', '')"></anvil-component></div>
  <anvil-component type="Label" name="text" prop:role='["tile-text"]' bind:text="self.item.get('text', '')"></anvil-component>
  <a class="tile-link" anvil:name="link" href="#help"><anvil-component type="Label" name="link_text" bind:text="self.item.get('link_text', '')"></anvil-component><i class="ic ic-arrow"></i></a>
</div>
